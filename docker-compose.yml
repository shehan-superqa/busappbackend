version: '3.8'

services:
  app:
    build: .
    container_name: bus-ticketing-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TCP_PORT=8080
      - DB_URL=${DB_URL}
    volumes:
      - ./logs:/var/log
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

